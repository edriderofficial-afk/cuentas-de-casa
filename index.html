<html lang="es">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Cuenta mixta</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fill:#EEEEF3; --ink:#1C1C1E; --mut:#6E6E73; --line:rgba(60,60,67,.13);
  --pri:#2F6FEB; --on-pri:#fff; --p1:#3F78C4; --p2:#E3962B; --ok:#1F9D55; --warn:#B86E00; --bad:#D92D20;
  --warn-bg:#FFF4E0; --bad-bg:#FDECEA; --ok-bg:#E6F6EC;
  --r:16px; --shadow:0 1px 2px rgba(0,0,0,.04);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --fill:#2C2C2E; --ink:#F2F2F7; --mut:#98989F; --line:rgba(84,84,88,.55);
    --pri:#4C8DFF; --p1:#6A9BE0; --p2:#F0AA45; --ok:#32D074; --warn:#FFB340; --bad:#FF6961;
    --warn-bg:#3A2A0C; --bad-bg:#3B1614; --ok-bg:#0F2E1C; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--ink)}
.num,.tab{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  padding:10px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:28px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);background:var(--card);border-radius:99px;padding:6px 11px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--pri);animation:pulse 1s infinite}.dot.err{background:var(--bad)}.dot.off{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}

main{max-width:600px;margin:0 auto;padding:6px 16px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.label{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:18px 4px 8px}
.label:first-child{margin-top:4px}
.muted{color:var(--mut)}.small{font-size:13px}

.monthbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.monthbar .m{text-align:center;font-size:20px;font-weight:700;text-transform:capitalize}
.monthbar .m small{display:block;font-size:13px;font-weight:500;color:var(--mut);text-transform:none}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:22px;color:var(--pri)}
.icon-btn:disabled{opacity:.35}

.hero .tot{margin-bottom:12px}
.hero .tot span{display:block;font-size:14px}
.hero .tot b{display:block;font-size:34px;letter-spacing:-.02em;line-height:1.15}
.bar{height:10px;border-radius:5px;overflow:hidden;display:flex;background:var(--fill);margin-bottom:6px}
.bar i{display:block;height:100%;transition:width .25s}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:12px}
.person{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.person .who{font-weight:650;display:flex;align-items:center;gap:8px}
.person .sw{width:10px;height:10px;border-radius:3px}
.person .amt{font-size:24px;font-weight:750;letter-spacing:-.01em;grid-column:1}
.person .left{font-size:14px;color:var(--mut);grid-column:1}
.person .acts{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.chip{border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;background:var(--fill);text-align:center;min-width:104px}
.chip.done{background:var(--ok-bg);color:var(--ok)}
.chip.pri{background:var(--pri);color:var(--on-pri)}
.note{border-radius:12px;padding:10px 12px;font-size:14px;background:var(--fill);margin-top:10px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.ok{background:var(--ok-bg);color:var(--ok)}

.field{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0;padding-top:0}
.field:last-child{padding-bottom:0}
.field .val{flex:1;min-width:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field .n{flex:1;min-width:0;border:0;background:transparent;padding:6px 0;outline:none}
.field label.n{padding:6px 0}
.money{display:flex;align-items:center;background:var(--fill);border-radius:10px;padding:0 10px;width:132px;flex:none}
.money input{width:100%;border:0;background:transparent;text-align:right;padding:9px 4px;outline:none;font-variant-numeric:tabular-nums}
.money span{color:var(--mut)}
.money.pending{outline:1.5px dashed var(--warn);outline-offset:-1.5px}
.del{width:32px;height:32px;border-radius:50%;color:var(--mut);font-size:20px;flex:none}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);background:var(--fill);border-radius:6px;padding:2px 6px;flex:none}
.add{display:flex;align-items:center;gap:8px;color:var(--pri);font-weight:600;padding:12px 0 0;border-top:1px solid var(--line);width:100%;margin-top:10px}
.sum{display:flex;justify-content:space-between;font-weight:700;padding-top:12px;margin-top:10px;border-top:1px solid var(--line)}

.btn{display:block;width:100%;border-radius:14px;padding:14px;font-weight:650;text-align:center;background:var(--pri);color:var(--on-pri)}
.btn.sec{background:var(--card);color:var(--pri)}
.btn.danger{background:var(--card);color:var(--bad)}
.btn+.btn{margin-top:10px}
.empty{text-align:center;padding:28px 16px}
.empty .big{font-size:44px}
.empty h2{margin:6px 0 4px;font-size:20px}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:10px;padding:2px}
.seg button{padding:8px;border-radius:8px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toggle{position:relative;width:51px;height:31px;flex:none}
.toggle input{opacity:0;position:absolute;inset:0;margin:0}
.toggle span{position:absolute;inset:0;border-radius:99px;background:var(--fill);transition:.2s;pointer-events:none}
.toggle span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.2s}
.toggle input:checked+span{background:var(--ok)}
.toggle input:checked+span::after{transform:translateX(20px)}

.hist{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.hist:first-child{border-top:0;padding-top:0}
.hist .mn{font-weight:650;text-transform:capitalize}
.hist .sub{font-size:13px;color:var(--mut)}
.hist .r{margin-left:auto;text-align:right}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;margin:6px 0 4px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--pri);min-height:3px}
.chart div.cur i{background:var(--p2)}
.chart small{font-size:11px;color:var(--mut);text-transform:capitalize}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--fill);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:18px}

.inp{width:100%;border:0;background:var(--fill);border-radius:10px;padding:11px 12px;outline:none}
.inp+.inp{margin-top:8px}
.help{font-size:14px;color:var(--mut);margin:8px 0 0}
ol.steps{padding-left:20px;margin:8px 0 0;font-size:14px}
ol.steps li{margin-bottom:6px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;
  background:color-mix(in srgb,var(--card) 85%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);padding:4px 0}
nav.tabs button.on{color:var(--pri)}
nav.tabs svg{width:26px;height:26px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:9;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Este mes</h1>
  <button class="pill" id="sync" data-act="tab" data-tab="ajustes"><span class="dot" id="syncDot"></span><span id="syncTxt">Solo en este dispositivo</span></button>
</header>
<main id="view"></main>
<nav class="tabs">
  <button data-act="tab" data-tab="mes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mes</button>
  <button data-act="tab" data-tab="historial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M10 20V5M15 20v-7M20 20V8"/></svg>Historial</button>
  <button data-act="tab" data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
"use strict";
/* ============ Datos ============ */
const KEY = "cuentamixta-v1", KSYNC = "cuentamixta-sync", VERSION = "2.0";
const uid = () => Math.random().toString(36).slice(2, 9);
const now = () => Date.now();
function fresh(){
  return { v:1, su:0, personas:["Eddy","Pareja"], reparto:"prop", cuenta:"Cuenta conjunta Openbank",
    plantilla:[
      {id:uid(), n:"Alquiler", i:null, f:true},
      {id:uid(), n:"Súper",    i:null, f:false},
      {id:uid(), n:"Luz",      i:null, f:false},
      {id:uid(), n:"Agua",     i:null, f:false},
      {id:uid(), n:"Gas",      i:null, f:false},
      {id:uid(), n:"Internet y móvil", i:null, f:true}
    ], meses:{} };
}
function valid(o){ return o && typeof o === "object" && o.v === 1 && Array.isArray(o.personas) && o.meses && typeof o.meses === "object"; }
function load(){ try{ const o = JSON.parse(localStorage.getItem(KEY)); if(valid(o)) return o; }catch(e){} return fresh(); }
let S = load();
let SY = (()=>{ try{ return JSON.parse(localStorage.getItem(KSYNC)) || null; }catch(e){ return null; } })();

/* ============ Utilidades ============ */
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const keyOf = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
const curKey = () => keyOf(new Date());
const shift = (k, n) => { const [y,m] = k.split("-").map(Number); return keyOf(new Date(y, m-1+n, 1)); };
const mName = k => MESES[+k.slice(5)-1];
const mYear = k => k.slice(0,4);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function parseNum(v){
  if(v === null || v === undefined) return null;
  let s = String(v).trim().replace(/\s|€/g, "");
  if(!s) return null;
  if(s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");            // 1.234,56
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");          // 1.234
  const n = Number(s);
  return isFinite(n) && n >= 0 ? Math.round(n*100)/100 : null;
}
function fmt(n, dec){ dec = dec ?? 2; const v = Math.round(Math.abs(n||0) * 10**dec) / 10**dec; let [i, d] = v.toFixed(dec).split(".");
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, "."); return ((n||0) < 0 && v ? "−" : "") + i + (d ? "," + d : "") + " €"; }
const fmtIn = n => n === null || n === undefined ? "" : String(n).replace(".", ",");
const pct = n => (n*100).toLocaleString("es-ES", {minimumFractionDigits:1, maximumFractionDigits:1}) + " %";
const nm = i => (S.personas[i] || "").trim() || (i ? "Persona 2" : "Persona 1");
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove("on"), 2200); }
const live = k => S.meses[k] && !S.meses[k].x ? S.meses[k] : null;
const monthKeys = () => Object.keys(S.meses).filter(k => live(k)).sort();

/* ============ Cálculo ============ */
function calc(m){
  const A = m.s[0] || 0, B = m.s[1] || 0, T = A + B;
  const G = Math.round(m.g.reduce((s, g) => s + (g.i || 0), 0) * 100) / 100;
  const share = S.reparto === "mitad" || T === 0 ? .5 : A / T;
  const a0 = Math.round(G * share * 100) / 100;
  const a1 = Math.round((G - a0) * 100) / 100;            // así siempre suma exacto
  return { A, B, T, G, share, a:[a0, a1], q:[A - a0, B - a1],
    pend: m.g.filter(g => g.i === null).map(g => g.n || "Sin nombre"),
    faltaSueldo: m.s[0] === null || m.s[1] === null };
}
function lastVal(k, name){
  const ks = monthKeys().filter(x => x < k).reverse();
  for(const x of ks){ const g = S.meses[x].g.find(g => g.n.trim().toLowerCase() === name.trim().toLowerCase() && g.i !== null); if(g) return g.i; }
  return null;
}
function lastSal(k, i){ const ks = monthKeys().filter(x => x < k).reverse(); for(const x of ks){ if(S.meses[x].s[i] !== null) return S.meses[x].s[i]; } return null; }

/* ============ Guardado + sincronización ============ */
let pushT = null, syncing = false, pendingPush = false, lastErr = "";
function save(kind, k){
  const t = now();
  if(kind === "mes" && S.meses[k]) S.meses[k].u = t;
  if(kind === "ajustes") S.su = t;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("No se ha podido guardar en este dispositivo"); }
  if(SY){ pendingPush = true; setSync("busy", "Guardando…"); clearTimeout(pushT); pushT = setTimeout(push, 1200); }
}
function merge(L, R){
  if(!valid(R)) return L; if(!valid(L)) return R;
  const out = (R.su || 0) > (L.su || 0) ? {...L, su:R.su, personas:R.personas, reparto:R.reparto, cuenta:R.cuenta, plantilla:R.plantilla} : {...L};
  out.meses = {...L.meses};
  for(const k in R.meses){ if(!out.meses[k] || (R.meses[k].u || 0) > (out.meses[k].u || 0)) out.meses[k] = R.meses[k]; }
  return out;
}
const canon = o => JSON.stringify(o, (k, v) => v && typeof v === "object" && !Array.isArray(v) ? Object.keys(v).sort().reduce((r, x) => (r[x] = v[x], r), {}) : v);
const b64e = s => { const b = new TextEncoder().encode(s); let r = ""; for(let i = 0; i < b.length; i += 0x8000) r += String.fromCharCode.apply(null, b.subarray(i, i+0x8000)); return btoa(r); };
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));
const apiUrl = c => `https://api.github.com/repos/${encodeURIComponent(c.o)}/${encodeURIComponent(c.r)}/contents/cuentas.json`;
async function gh(c, method, body){
  const r = await fetch(apiUrl(c) + (method === "GET" ? "?t=" + now() : ""), { method, cache:"no-store",
    headers:{ "Authorization":"Bearer " + c.t, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", ...(body ? {"Content-Type":"application/json"} : {}) },
    body: body ? JSON.stringify(body) : undefined });
  return r;
}
function errText(status){
  if(status === 401) return "La clave no es válida o ha caducado";
  if(status === 403) return "La clave no tiene permiso para escribir";
  if(status === 404) return "No encuentro el repositorio de datos";
  return "Error de GitHub (" + status + ")";
}
async function pull(c){
  const r = await gh(c, "GET");
  if(r.status === 404){
    // ¿No existe el archivo o no existe el repo? Lo distingue la propia API del repo.
    const rr = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.o)}/${encodeURIComponent(c.r)}`, {headers:{"Authorization":"Bearer " + c.t, "Accept":"application/vnd.github+json"}, cache:"no-store"});
    if(rr.ok) return { sha:null, data:null };
    throw new Error(errText(rr.status));
  }
  if(!r.ok) throw new Error(errText(r.status));
  const j = await r.json();
  let data = null; try{ data = JSON.parse(b64d(j.content)); }catch(e){}
  return { sha:j.sha, data };
}
async function sync(reason){
  if(!SY || syncing) { if(syncing) pendingPush = true; return; }
  if(!navigator.onLine){ setSync("off", "Sin conexión · guardado aquí"); return; }
  syncing = true; setSync("busy", reason === "push" ? "Guardando…" : "Sincronizando…");
  try{
    for(let intento = 0; intento < 3; intento++){
      const { sha, data } = await pull(SY);
      const before = JSON.stringify(S);
      if(data) S = merge(S, data);
      if(JSON.stringify(S) !== before){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} softRender(); }
      const remoteSame = data && canon(data) === canon(S);
      if(remoteSame){ pendingPush = false; break; }
      const r = await gh(SY, "PUT", { message:"Actualizar cuentas · " + new Date().toLocaleString("es-ES"), content:b64e(canon(S)), ...(sha ? {sha} : {}) });
      if(r.ok){ pendingPush = false; break; }
      if(r.status === 409 || r.status === 422) continue;      // el otro móvil ha guardado a la vez: se vuelve a juntar
      throw new Error(errText(r.status));
    }
    SY.last = now(); localStorage.setItem(KSYNC, JSON.stringify(SY)); lastErr = "";
    setSync("ok", "Sincronizado");
  }catch(e){
    lastErr = e && e.message && !/fetch|network|load/i.test(e.message) ? e.message : "Sin conexión · guardado aquí";
    setSync(/conexión/.test(lastErr) ? "off" : "err", lastErr);
  }finally{
    syncing = false;
    if(pendingPush){ clearTimeout(pushT); pushT = setTimeout(push, 800); }
  }
}
function push(){ sync("push"); }
function setSync(state, txt){
  document.getElementById("syncDot").className = "dot " + state;
  document.getElementById("syncTxt").textContent = txt;
}
function initSyncPill(){ if(SY) setSync("ok", "Sincronizado"); else setSync("", "Solo en este dispositivo"); }

/* ============ Vistas ============ */
let tab = "mes", cur = null, confirmDel = false;
function pickStartMonth(){
  const k = curKey(); if(live(k)) return k;
  const ks = monthKeys(); return ks.length && ks[ks.length-1] > k ? ks[ks.length-1] : k;
}
const view = () => document.getElementById("view");
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  document.getElementById("title").textContent = tab === "mes" ? "Cuenta mixta" : tab === "historial" ? "Historial" : "Ajustes";
  view().innerHTML = tab === "mes" ? vMes() : tab === "historial" ? vHist() : vAjustes();
  if(tab === "mes") paintHero();
}
let needRender = false;
function softRender(){
  const a = document.activeElement;
  if(a && (a.tagName === "INPUT") && view().contains(a)){ needRender = true; return; }
  render();
}
document.addEventListener("focusout", () => setTimeout(() => { if(needRender && !(document.activeElement && document.activeElement.tagName === "INPUT")){ needRender = false; render(); } }, 50));

function vMes(){
  const k = cur, m = live(k), isCur = k === curKey();
  let h = `<div class="monthbar">
    <button class="icon-btn" data-act="prev" aria-label="Mes anterior">‹</button>
    <div class="m">${mName(k)} <span class="muted">${mYear(k)}</span><small>${isCur ? "Este mes" : (k < curKey() ? "Mes pasado" : "Mes que viene")}</small></div>
    <button class="icon-btn" data-act="next" aria-label="Mes siguiente">›</button></div>`;
  if(!m){
    const prev = monthKeys().filter(x => x < k).pop();
    return h + `<div class="card empty"><div class="big">🗓️</div><h2>Empezar ${mName(k)}</h2>
      <p class="muted">Se crean los gastos de tu plantilla. Los fijos se rellenan solos; los que cambian (luz, agua…) los pones cuando llegue la factura.</p>
      <button class="btn" data-act="start">Empezar ${mName(k)}</button>
      ${prev ? `<button class="btn sec" data-act="startcopy">Copiar ${mName(prev)} tal cual</button>` : ""}
      </div>`;
  }
  h += `<div class="card hero" data-hero></div>`;
  h += `<div class="label">Sueldos de ${mName(k)}</div><div class="card">`;
  [0,1].forEach(i => {
    const ph = lastSal(k, i);
    h += `<div class="field"><label class="n" for="s${i}"><span class="sw" style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--p${i+1});margin-right:8px"></span>${esc(nm(i))}</label>
      <div class="money ${m.s[i] === null ? "pending" : ""}"><input id="s${i}" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="${ph !== null ? fmtIn(ph) : "0"}" value="${fmtIn(m.s[i])}" data-in="sal" data-i="${i}"><span>€</span></div></div>`;
  });
  h += `<p class="help">Lo que os entra limpio en la cuenta este mes (nómina neta, extras incluidos).</p></div>`;
  h += `<div class="label">Gastos de casa</div><div class="card" id="gastos">`;
  m.g.forEach(g => {
    const ph = g.i === null ? lastVal(k, g.n) : null;
    h += `<div class="field" data-row="${g.id}">
      <input class="n" value="${esc(g.n)}" placeholder="Nombre del gasto" data-in="gn" data-id="${g.id}" autocomplete="off" enterkeyhint="next">
      <div class="money ${g.i === null ? "pending" : ""}"><input inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="${ph !== null ? fmtIn(ph) : "0"}" value="${fmtIn(g.i)}" data-in="gi" data-id="${g.id}" aria-label="Importe de ${esc(g.n)}"><span>€</span></div>
      <button class="del" data-act="delg" data-id="${g.id}" aria-label="Quitar ${esc(g.n)}">×</button></div>`;
  });
  h += `<button class="add" data-act="addg"><span style="font-size:22px;line-height:1">＋</span> Añadir gasto</button>
    <div class="sum"><span>Total</span><span class="num" id="gtot"></span></div>
    <p class="help">El recuadro naranja de puntos indica que falta el importe. Gris claro = lo del mes pasado, como referencia.</p></div>`;
  h += `<button class="btn danger" data-act="delmes" style="margin-top:22px">${confirmDel ? "Pulsa otra vez para borrar " + mName(k) : "Borrar " + mName(k)}</button>`;
  return h;
}
function paintHero(){
  const el = view().querySelector("[data-hero]"); if(!el) return;
  const m = live(cur), c = calc(m);
  const tot = document.getElementById("gtot"); if(tot) tot.textContent = fmt(c.G);
  let notes = "";
  if(c.faltaSueldo) notes += `<div class="note warn">Faltan sueldos: hasta que estén los dos, se reparte a medias.</div>`;
  if(c.pend.length) notes += `<div class="note warn">Pendiente de importe: ${c.pend.map(esc).join(", ")}. El reparto se recalcula al ponerlo.</div>`;
  if(c.T > 0 && c.G > c.T) notes += `<div class="note bad">Los gastos superan lo que cobráis entre los dos.</div>`;
  const both = m.p[0] && m.p[1];
  if(!notes && c.T > 0 && c.G > 0) notes = both
    ? `<div class="note ok">✓ Los dos habéis hecho la transferencia de ${mName(cur)}.</div>`
    : `<div class="note">${S.reparto === "mitad" ? "Cada uno pone la mitad." : `Los dos ponéis el mismo esfuerzo: el <b>${pct(c.G / c.T)}</b> de vuestro sueldo. Quien cobra más pone más euros, pero el mismo porcentaje.`}</div>`;
  el.innerHTML = `<div class="tot"><span class="muted">Este mes a ${esc(S.cuenta || "la cuenta común")}</span><b class="num">${fmt(c.G)}</b></div>
    <div class="bar"><i style="width:${c.share*100}%;background:var(--p1)"></i><i style="width:${(1-c.share)*100}%;background:var(--p2)"></i></div>
    <div class="legend"><span>${esc(nm(0))} ${pct(c.share)}</span><span>${pct(1-c.share)} ${esc(nm(1))}</span></div>
    ${[0,1].map(i => `<div class="person">
      <div class="who"><span class="sw" style="background:var(--p${i+1})"></span>${esc(nm(i))} transfiere</div>
      <div class="amt num">${fmt(c.a[i])}</div>
      <div class="left num">Le quedan ${fmt(c.q[i])}${c.q[i] < 0 ? " ⚠️" : ""}</div>
      <div class="acts">
        <button class="chip" data-act="copy" data-v="${c.a[i]}">Copiar</button>
        <button class="chip ${m.p[i] ? "done" : "pri"}" data-act="paid" data-i="${i}" aria-pressed="${!!m.p[i]}">${m.p[i] ? "✓ Hecha" : "Marcar hecha"}</button>
      </div></div>`).join("")}
    ${notes}`;
}
function vHist(){
  const ks = monthKeys();
  if(!ks.length) return `<div class="card empty"><div class="big">📊</div><h2>Aún no hay meses</h2><p class="muted">Cuando empecéis el primer mes, aquí veréis cómo cambian los gastos.</p><button class="btn" data-act="tab" data-tab="mes">Ir al mes</button></div>`;
  const last = ks.slice(-12), tots = last.map(k => calc(S.meses[k]).G), max = Math.max(...tots, 1);
  const all = ks.map(k => calc(S.meses[k])).filter(c => c.G > 0);
  const avg = all.length ? all.reduce((s, c) => s + c.G, 0) / all.length : 0;
  const yr = String(new Date().getFullYear()), yk = ks.filter(k => k.startsWith(yr));
  const yt = [0,1].map(i => yk.reduce((s, k) => s + calc(S.meses[k]).a[i], 0));
  let h = `<div class="label">Gastos de casa por mes</div><div class="card">
    <div class="chart">${last.map((k, j) => `<div class="${k === curKey() ? "cur" : ""}" title="${fmt(tots[j])}"><i style="height:${Math.max(2, tots[j]/max*100)}%"></i><small>${mName(k).slice(0,3)}</small></div>`).join("")}</div>
    <div class="stats"><div class="stat"><span class="small muted">Media al mes</span><b class="num">${fmt(avg, 0)}</b></div>
    <div class="stat"><span class="small muted">Meses apuntados</span><b>${ks.length}</b></div>
    <div class="stat"><span class="small muted">${esc(nm(0))} en ${yr}</span><b class="num">${fmt(yt[0], 0)}</b></div>
    <div class="stat"><span class="small muted">${esc(nm(1))} en ${yr}</span><b class="num">${fmt(yt[1], 0)}</b></div></div></div>
    <div class="label">Todos los meses</div><div class="card">`;
  ks.slice().reverse().forEach(k => {
    const m = S.meses[k], c = calc(m), ok = m.p[0] && m.p[1];
    h += `<button class="hist" data-act="open" data-k="${k}">
      <div><div class="mn">${mName(k)} ${mYear(k)}</div><div class="sub num">${esc(nm(0))} ${fmt(c.a[0], 0)} · ${esc(nm(1))} ${fmt(c.a[1], 0)}</div></div>
      <div class="r"><div class="num" style="font-weight:650">${fmt(c.G, 0)}</div><div class="sub">${ok ? "✓ Pagado" : c.pend.length ? "Faltan importes" : "Sin pagar"}</div></div></button>`;
  });
  return h + `</div>`;
}
function vAjustes(){
  let h = `<div class="label">Vosotros</div><div class="card">
    ${[0,1].map(i => `<div class="field"><label class="n" for="p${i}"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--p${i+1});margin-right:8px"></span>Persona ${i+1}</label>
      <input id="p${i}" class="inp" style="width:55%" value="${esc(S.personas[i])}" data-in="pers" data-i="${i}" autocomplete="off"></div>`).join("")}
    <div class="field"><label class="n" for="cta">Cuenta común</label><input id="cta" class="inp" style="width:55%" value="${esc(S.cuenta)}" data-in="cta" autocomplete="off"></div></div>
  <div class="label">Cómo repartís</div><div class="card">
    <div class="seg"><button data-act="rep" data-v="prop" class="${S.reparto !== "mitad" ? "on" : ""}">Según sueldo</button><button data-act="rep" data-v="mitad" class="${S.reparto === "mitad" ? "on" : ""}">A medias</button></div>
    <p class="help">${S.reparto === "mitad" ? "Cada uno pone el 50 % de los gastos, cobre lo que cobre." : "Cada uno pone en proporción a lo que cobra ese mes. Es el modelo de cuenta mixta."}</p></div>
  <div class="label">Plantilla de gastos</div><div class="card">
    <p class="help" style="margin:0 0 10px">Es lo que se crea al empezar cada mes. Marca <b>Fijo</b> los que siempre cuestan lo mismo (alquiler, internet) y pon su importe; los demás los rellenas cada mes.</p>`;
  S.plantilla.forEach(p => {
    h += `<div class="field"><input class="n" value="${esc(p.n)}" placeholder="Nombre" data-in="pn" data-id="${p.id}" autocomplete="off">
      ${p.f ? `<div class="money" style="width:104px"><input inputmode="decimal" placeholder="0" value="${fmtIn(p.i)}" data-in="pi" data-id="${p.id}" aria-label="Importe fijo de ${esc(p.n)}"><span>€</span></div>` : `<span class="tag">Variable</span>`}
      <label class="toggle" title="Fijo"><input type="checkbox" ${p.f ? "checked" : ""} data-in="pf" data-id="${p.id}" aria-label="${esc(p.n)} es fijo"><span></span></label>
      <button class="del" data-act="delp" data-id="${p.id}" aria-label="Quitar ${esc(p.n)}">×</button></div>`;
  });
  h += `<button class="add" data-act="addp"><span style="font-size:22px;line-height:1">＋</span> Añadir a la plantilla</button></div>`;
  h += `<div class="label">Guardar y usar en varios dispositivos</div><div class="card">`;
  if(SY){
    h += `<div class="field"><span class="n">Estado</span><span class="small val ${lastErr ? "" : "muted"}" style="${lastErr ? "color:var(--bad);white-space:normal" : ""}">${lastErr ? esc(lastErr) : "Conectado"}</span></div>
      <div class="field"><span class="n" style="flex:none">Repositorio</span><span class="small muted val">${esc(SY.r)}</span></div>
      <div class="field"><span class="n" style="flex:none">Última vez</span><span class="small muted val">${SY.last ? new Date(SY.last).toLocaleString("es-ES", {dateStyle:"short", timeStyle:"short"}) : "—"}</span></div>
      <button class="btn" data-act="syncnow" style="margin-top:12px">Sincronizar ahora</button>
      <button class="btn sec" data-act="copycode">Copiar código para otro dispositivo</button>
      <p class="help">Para usar la app en el PC: abre la app allí, ve a Ajustes, pega este código y pulsa «Conectar con código». No lo publiques: da acceso a vuestras cuentas.</p>
      <button class="btn danger" data-act="unlink" style="margin-top:12px">Desconectar este dispositivo</button>`;
  } else {
    h += `<p class="help" style="margin-top:0">Los datos ya se guardan en este dispositivo. Conéctalo a tu repositorio privado de GitHub para tener copia segura y ver lo mismo en el iPhone y en el PC.</p>
      <div style="margin-top:12px"><input class="inp" id="cfgCode" placeholder="Pegar código de otro dispositivo" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn" data-act="usecode" style="margin-top:8px">Conectar con código</button></div>
      <p class="help" style="text-align:center;margin:14px 0">— o, la primera vez —</p>
      <input class="inp" id="cfgO" placeholder="Usuario de GitHub" autocomplete="off" autocapitalize="off" spellcheck="false" value="edriderofficial-afk">
      <input class="inp" id="cfgR" placeholder="Repositorio privado de datos" autocomplete="off" autocapitalize="off" spellcheck="false" value="cuentas-de-casa-datos">
      <input class="inp" id="cfgT" placeholder="Clave (token) github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false" type="password">
      <button class="btn" data-act="link" style="margin-top:8px">Conectar</button>`;
  }
  h += `</div><div class="label">Copia de seguridad</div><div class="card">
    <button class="btn sec" data-act="export">Descargar copia (.json)</button>
    <button class="btn sec" data-act="import">Restaurar una copia</button></div>
    <p class="help" style="text-align:center">Cuenta mixta · v${VERSION}</p>`;
  return h;
}

/* ============ Acciones ============ */
function newMonth(k, copyFrom){
  if(copyFrom){ const p = S.meses[copyFrom]; S.meses[k] = { s:[...p.s], g:p.g.map(g => ({...g, id:uid()})), p:[false,false], u:now() }; }
  else S.meses[k] = { s:[null,null], g:S.plantilla.map(p => ({id:uid(), n:p.n, i:p.f ? p.i : null})), p:[false,false], u:now() };
  save("mes", k); render();
}
function act(a, d, el){
  switch(a){
    case "tab": tab = d.tab; confirmDel = false; if(tab === "mes" && !cur) cur = pickStartMonth(); render(); window.scrollTo(0,0); break;
    case "prev": cur = shift(cur, -1); confirmDel = false; render(); break;
    case "next": cur = shift(cur, 1); confirmDel = false; render(); break;
    case "open": cur = d.k; tab = "mes"; render(); window.scrollTo(0,0); break;
    case "start": newMonth(cur); break;
    case "startcopy": newMonth(cur, monthKeys().filter(x => x < cur).pop()); break;
    case "addg": { const id = uid(); live(cur).g.push({id, n:"", i:null}); save("mes", cur); render(); const i = view().querySelector(`[data-row="${id}"] .n`); if(i) i.focus(); break; }
    case "delg": { const m = live(cur); m.g = m.g.filter(g => g.id !== d.id); save("mes", cur); render(); break; }
    case "paid": { const m = live(cur); m.p[+d.i] = !m.p[+d.i]; save("mes", cur); paintHero(); if(m.p[+d.i]) toast("Transferencia marcada como hecha"); break; }
    case "copy": { const v = (+d.v).toFixed(2).replace(".", ","); (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast("Copiado: " + v + " €"), () => toast(v + " €")); break; }
    case "delmes": if(!confirmDel){ confirmDel = true; render(); setTimeout(() => { if(confirmDel){ confirmDel = false; if(tab === "mes") render(); } }, 4000); } else { confirmDel = false; S.meses[cur] = {x:true, u:now()}; save("mes", cur); render(); toast("Mes borrado"); } break;
    case "rep": S.reparto = d.v; save("ajustes"); render(); break;
    case "addp": { const id = uid(); S.plantilla.push({id, n:"", i:null, f:false}); save("ajustes"); render(); const i = view().querySelector(`[data-in="pn"][data-id="${id}"]`); if(i) i.focus(); break; }
    case "delp": S.plantilla = S.plantilla.filter(p => p.id !== d.id); save("ajustes"); render(); break;
    case "syncnow": sync(); break;
    case "link": {
      const o = document.getElementById("cfgO").value.trim(), r = document.getElementById("cfgR").value.trim(), t = document.getElementById("cfgT").value.trim();
      if(!o || !r || !t){ toast("Rellena usuario, repositorio y clave"); break; }
      connect({o, r, t}); break; }
    case "usecode": {
      try{ const c = JSON.parse(atob(document.getElementById("cfgCode").value.trim().replace(/^CM1:/, ""))); if(!c.o || !c.r || !c.t) throw 0; connect(c); }
      catch(e){ toast("Ese código no es válido"); }
      break; }
    case "copycode": { const code = "CM1:" + btoa(JSON.stringify({o:SY.o, r:SY.r, t:SY.t})); (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => toast("Código copiado. Pégalo en el otro dispositivo"), () => toast("No se ha podido copiar")); break; }
    case "unlink": SY = null; try{ localStorage.removeItem(KSYNC); }catch(e){} lastErr = ""; initSyncPill(); render(); toast("Desconectado. Los datos siguen aquí"); break;
    case "export": {
      const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob), aEl = document.createElement("a");
      aEl.href = url; aEl.download = "cuenta-mixta-" + new Date().toISOString().slice(0,10) + ".json"; document.body.appendChild(aEl); aEl.click(); aEl.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); break; }
    case "import": document.getElementById("fileIn").click(); break;
  }
}
async function connect(c){
  setSync("busy", "Conectando…");
  try{
    const { data } = await pull(c);
    SY = {...c, last:0}; localStorage.setItem(KSYNC, JSON.stringify(SY));
    if(data) S = merge(S, data);
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    await sync(); render(); toast(data ? "Conectado. Datos compartidos cargados" : "Conectado. Ya se guarda en GitHub");
  }catch(e){ setSync("err", "No conectado"); toast(e.message && !/fetch|network|load/i.test(e.message) ? e.message : "Sin conexión con GitHub"); initSyncPill(); }
}

/* ============ Eventos ============ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  act(el.dataset.act, el.dataset, el);
});
document.addEventListener("input", e => {
  const el = e.target, t = el.dataset.in; if(!t) return;
  if(t === "sal"){ const m = live(cur); m.s[+el.dataset.i] = parseNum(el.value); el.parentNode.classList.toggle("pending", m.s[+el.dataset.i] === null); save("mes", cur); paintHero(); }
  else if(t === "gi"){ const m = live(cur), g = m.g.find(g => g.id === el.dataset.id); if(g){ g.i = parseNum(el.value); el.parentNode.classList.toggle("pending", g.i === null); save("mes", cur); paintHero(); } }
  else if(t === "gn"){ const g = live(cur).g.find(g => g.id === el.dataset.id); if(g){ g.n = el.value; save("mes", cur); paintHero(); } }
  else if(t === "pers"){ S.personas[+el.dataset.i] = el.value; save("ajustes"); }
  else if(t === "cta"){ S.cuenta = el.value; save("ajustes"); }
  else if(t === "pn"){ const p = S.plantilla.find(p => p.id === el.dataset.id); if(p){ p.n = el.value; save("ajustes"); } }
  else if(t === "pi"){ const p = S.plantilla.find(p => p.id === el.dataset.id); if(p){ p.i = parseNum(el.value); save("ajustes"); } }
});
document.addEventListener("change", e => {
  const el = e.target;
  if(el.dataset.in === "pf"){ const p = S.plantilla.find(p => p.id === el.dataset.id); if(p){ p.f = el.checked; if(!p.f) p.i = null; save("ajustes"); render(); } }
  if(el.id === "fileIn" && el.files[0]){
    const fr = new FileReader();
    fr.onload = () => { try{ const o = JSON.parse(fr.result); if(!valid(o)) throw 0; S = merge(S, o); Object.keys(o.meses).forEach(k => { S.meses[k] = o.meses[k]; S.meses[k].u = now(); }); save("ajustes"); render(); toast("Copia restaurada"); }catch(x){ toast("Ese archivo no es una copia válida"); } el.value = ""; };
    fr.readAsText(el.files[0]);
  }
});
// Al pulsar "Hecho" en el teclado, cierra el teclado
document.addEventListener("keydown", e => { if(e.key === "Enter" && e.target.tagName === "INPUT" && e.target.inputMode === "decimal") e.target.blur(); });
// Al salir de un importe, se muestra bien escrito
document.addEventListener("focusout", e => { const el = e.target; if(["sal","gi","pi"].includes(el.dataset.in)){ const v = parseNum(el.value); el.value = fmtIn(v); } });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && SY) sync(); });
window.addEventListener("online", () => { if(SY) sync(); });
window.addEventListener("storage", e => { if(e.key === KEY){ S = load(); softRender(); } });

/* ============ Arranque ============ */
cur = pickStartMonth();
initSyncPill();
render();
if(SY) sync();
try{ if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
</script>
</body>
</html>
