<style>
/* Layout: una columna tranquila; lo esencial arriba, el detalle plegado. Barra inferior con el + en el centro. */
:root{
  --bg:#F3F6F4; --card:#FFFFFF; --soft:#E8EEEB; --ink:#13231E; --muted:#66776F; --line:#DFE7E3;
  --accent:#0D6B5B; --on-accent:#FFFFFF; --gold:#C8901A; --pos:#1E7A4C; --neg:#B23A2E; --warn:#A86A12;
  --c1:#0D6B5B; --c2:#C8901A; --c3:#3E7CB1; --c4:#B23A2E; --c5:#7A5BA6; --c6:#5E9E43; --c7:#D06A3B; --c8:#2B9AA0; --c9:#8C7A4E; --c10:#C2507C; --c11:#4B5D8C; --c12:#7F8F3A; --c13:#9A6B5A; --c14:#5F7A75;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1412; --card:#141F1C; --soft:#1C2A26; --ink:#E5EEEA; --muted:#93A59F; --line:#24332F;
  --accent:#3DB39C; --on-accent:#06201B; --gold:#EBB548; --pos:#4CC386; --neg:#F06E62; --warn:#E3A44A;
  --c1:#3DB39C; --c2:#EBB548; --c3:#6FA8DC; --c4:#F06E62; --c5:#A98BD6; --c6:#85C86A; --c7:#F0925E; --c8:#4FC3C9; --c9:#C2AE7A; --c10:#E681A8; --c11:#8296CC; --c12:#B4C467; --c13:#C99A88; --c14:#8FAAA4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1412; --card:#141F1C; --soft:#1C2A26; --ink:#E5EEEA; --muted:#93A59F; --line:#24332F;
  --accent:#3DB39C; --on-accent:#06201B; --gold:#EBB548; --pos:#4CC386; --neg:#F06E62; --warn:#E3A44A;
  --c1:#3DB39C; --c2:#EBB548; --c3:#6FA8DC; --c4:#F06E62; --c5:#A98BD6; --c6:#85C86A; --c7:#F0925E; --c8:#4FC3C9; --c9:#C2AE7A; --c10:#E681A8; --c11:#8296CC; --c12:#B4C467; --c13:#C99A88; --c14:#8FAAA4; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
input,select,textarea{font-size:16px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.muted{color:var(--muted)}
.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

main{max-width:640px;margin:0 auto;padding-block:14px 120px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
@media (min-width:1000px){main{max-width:980px}.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:start}}

.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}
.head h1{font-size:26px;font-weight:800}
.month{display:flex;align-items:center;gap:2px}
.month button{border:0;background:transparent;cursor:pointer;color:var(--muted);height:40px;min-width:40px;border-radius:12px;font-size:20px}
.month .ml{font-size:15px;font-weight:700;color:var(--ink);padding:0 6px;min-width:112px;text-align:center}
.month button:hover{background:var(--soft)}

.left{margin-bottom:26px}
.left .big{font-family:var(--mono);font-size:clamp(44px,13vw,64px);font-weight:500;letter-spacing:-.05em;line-height:1.02;margin:4px 0 14px}
.flow{height:10px;border-radius:99px;background:var(--soft);display:flex;overflow:hidden}
.flow i{display:block;height:100%}
.flowk{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:14px;flex-wrap:wrap}
.flowk span{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}

.notice{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;margin-bottom:22px;font-size:14px;background:color-mix(in srgb,var(--warn) 14%,var(--card));color:var(--ink)}
.notice b{font-weight:700}

.sec{margin-bottom:26px}
.sec>h2{font-size:17px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec>h2 small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
.panel{background:var(--card);border-radius:18px;padding:16px}

.wheel{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.wheel svg{width:100%;height:auto;display:block}
@media (max-width:440px){.wheel{grid-template-columns:118px 1fr;gap:14px}}
.rows{display:grid}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border:0;background:transparent;text-align:left;width:100%;cursor:pointer;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.row .v{font-family:var(--mono);font-size:15px;white-space:nowrap}
.row .sub{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-4px}
.bar{grid-column:2/4;height:4px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:-2px}
.bar i{display:block;height:100%;border-radius:9px}
.over{color:var(--neg)!important}

.owe{display:flex;justify-content:space-between;align-items:center;gap:12px}
.owe b{font-family:var(--display);font-size:20px;font-weight:700}
.owe .muted{font-size:13px}

details.more{margin-bottom:26px}
details.more>summary{list-style:none;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;padding:12px;border-radius:14px;color:var(--muted);font-weight:600;font-size:14px;background:var(--soft)}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{margin-bottom:18px}
details.more>summary::after{content:"▾";font-size:12px}
details.more[open]>summary::after{content:"▴"}
.stack{display:flex;height:12px;border-radius:9px;overflow:hidden;background:var(--soft);margin-bottom:12px}
.stack i{display:block;height:100%}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--pos) 15%,transparent);color:var(--pos)}
.pill.bad{background:color-mix(in srgb,var(--neg) 15%,transparent);color:var(--neg)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}

/* movimientos */
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px;padding-bottom:4px}
.filters button,.chip{border:0;background:var(--soft);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;min-height:38px;color:var(--ink)}
.filters button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{width:100%;border:0;background:var(--card);border-radius:12px;padding:11px 14px;margin-bottom:6px;min-height:44px}
.day{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 4px;text-transform:capitalize}
.tx{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:10px 0;cursor:pointer;border-bottom:1px solid var(--line)}
.ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff}
.tx .t{min-width:0}
.tx .t b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-family:var(--mono);font-size:15px;white-space:nowrap}
.amt.in{color:var(--pos)} .amt.sav{color:var(--gold)} .amt.tr{color:var(--muted)}
.empty{text-align:center;padding:40px 10px;display:grid;gap:12px;justify-items:center}
.empty h2{font-size:22px}
.empty p{margin:0;color:var(--muted);max-width:36ch}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:14px;border:0;background:var(--soft);cursor:pointer;font-weight:600;color:var(--ink);text-decoration:none}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.dng{color:var(--neg)}
.btn.dng.arm{background:var(--neg);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:11px}
.btn.wide{width:100%}
.link{border:0;background:transparent;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 0;font-size:14px}
.demo{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--gold);color:#1B1405;border-radius:14px;padding:10px 14px;margin-bottom:16px;font-weight:600;font-size:14px}
.demo button{background:#1B1405;color:#F6E7C2;border:0;border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;max-width:100%;
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.nav{padding-left:calc(50% - 300px);padding-right:calc(50% - 300px)}}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;padding:6px 0;min-height:50px;justify-content:center}
.nav a svg{width:23px;height:23px}
.nav a[aria-current="page"]{color:var(--ink)}
.nav .add{justify-self:center;width:54px;height:54px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}

/* hoja */
.ov{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:94dvh;overflow:auto;overscroll-behavior:contain;border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:24px;padding-top:18px}.sheet .grab{display:none}}
.sheet h2{font-size:20px;margin-bottom:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);padding:4px;border-radius:13px;gap:4px;margin-bottom:6px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 4px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px color-mix(in srgb,var(--ink) 14%,transparent)}
.amtin{display:block;width:100%;border:0;background:transparent;text-align:center;font-family:var(--mono);font-size:44px!important;letter-spacing:-.04em;padding:14px 0 10px;outline:0}
.cats{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 16px}
.cats .chip{display:inline-flex;align-items:center;gap:7px}
.lab{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px;display:block}
.line{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.field{width:100%;border:0;background:var(--card);border-radius:12px;padding:11px 13px;min-height:46px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two>*{min-width:0}
details.det>summary{list-style:none;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;padding:6px 0 10px}
details.det>summary::-webkit-details-marker{display:none}
.act{display:flex;gap:10px;margin-top:16px}
.act .btn{flex:1}
.err{color:var(--neg);font-size:14px;margin:8px 0 0}

/* objetivos / ajustes */
.ed{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ed:last-child{border-bottom:0}
.ed input{text-align:right;font-family:var(--mono)}
details.set{background:var(--card);border-radius:18px;margin-bottom:10px}
details.set>summary{list-style:none;cursor:pointer;padding:16px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
details.set>summary::-webkit-details-marker{display:none}
details.set>summary::after{content:"›";color:var(--muted);font-size:20px;transition:transform .15s}
details.set[open]>summary::after{transform:rotate(90deg)}
details.set .in{padding:0 16px 16px;display:grid;gap:12px}
details.set p{margin:0;font-size:14px;color:var(--muted)}
textarea.field{min-height:90px;font-family:var(--mono);font-size:12px!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(22px);opacity:.7}}}
</style>
</head>
<body>

<main id="main"></main>
<nav class="nav" id="nav" aria-label="Secciones">
  <a href="#inicio" data-v="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 4"/></svg>Inicio</a>
  <a href="#movimientos" data-v="movimientos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Movimientos</a>
  <button class="add" id="add" aria-label="Apuntar movimiento">+</button>
  <a href="#objetivos" data-v="objetivos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".5"/></svg>Objetivos</a>
  <a href="#ajustes" data-v="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</a>
</nav>
<div id="layer"></div>

<script>
(function(){
"use strict";
const KEY="cuentas-casa-v2", OLDKEY="cuentas-casa-v1";
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const EUR=new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"});
const EUR0=new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const f2=n=>EUR.format(n||0), f0=n=>EUR0.format(Math.round(n||0)), pct=n=>(isFinite(n)?Math.round(n*100):0)+" %";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7), now=()=>Date.now();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===""||v==null)return 0;const n=parseFloat(String(v).replace(/\s|€/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."));return isFinite(n)?n:0};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

/* Categorías simples: una sola lista, sin subgrupos */
const DEF=[
["Nómina Eddy","Ingreso"],["Nómina Mai","Ingreso"],["Paga extra","Ingreso"],["Horas extra / chárter","Ingreso"],["Ventas flipping","Ingreso"],["Devolución préstamo padre","Ingreso"],["Otros ingresos","Ingreso"],
["Alquiler","Gasto","Necesidad"],["Facturas","Gasto","Necesidad"],["Supermercado","Gasto","Necesidad"],["Transporte","Gasto","Necesidad"],["Préstamos","Gasto","Deuda"],["Hacienda","Gasto","Deuda"],
["Seguros","Gasto","Necesidad"],["Salud","Gasto","Necesidad"],["Suscripciones","Gasto","Deseo"],["Ocio y restaurantes","Gasto","Deseo"],["Compras","Gasto","Deseo"],["Flipping","Gasto","Negocio"],["Familia","Gasto","Necesidad"],["Otros gastos","Gasto","Deseo"],
["Colchón","Ahorro","Ahorro"],["Inversión","Ahorro","Ahorro"],["Amortizar préstamo","Ahorro","Ahorro"],["Hucha anual","Ahorro","Ahorro"],
["Traspaso","Transferencia"]];
const MAP={"Nómina ACL (Eddy)":"Nómina Eddy","Nómina Top Freight (Eddy)":"Nómina Eddy","Nómina Top Freight (Mai)":"Nómina Mai","Paga extra ACL":"Paga extra","Chárter / horas extra":"Horas extra / chárter",
"Devolución préstamo (padre)":"Devolución préstamo padre","Devolución Hacienda":"Otros ingresos","Seguro hogar":"Seguros","Seguro coche":"Seguros","Reparaciones casa":"Otros gastos",
"Luz":"Facturas","Gas":"Facturas","Agua":"Facturas","Internet y móvil":"Facturas","Gasolina":"Transporte","ITV":"Transporte","Mantenimiento coche":"Transporte","Parking y peajes":"Transporte","Transporte público":"Transporte",
"Préstamo ING (Eddy)":"Préstamos","Préstamo ING (padre)":"Préstamos","Tarjeta de crédito ING":"Préstamos","Hacienda (plazos)":"Hacienda","Asesoría fiscal (TaxDown)":"Hacienda",
"Farmacia y médico":"Salud","Dentista":"Salud","Cuidado personal":"Salud","Streaming y apps":"Suscripciones","Gimnasio":"Suscripciones",
"Restaurantes y delivery":"Ocio y restaurantes","Salidas y planes":"Ocio y restaurantes","Viajes":"Ocio y restaurantes","Regalos":"Ocio y restaurantes",
"Ropa y calzado":"Compras","Hogar y tecnología":"Compras","Compra de dispositivos":"Flipping","Piezas, envíos y comisiones":"Flipping","Ayuda a la familia":"Familia","Imprevistos":"Otros gastos",
"Fondo de emergencia":"Colchón","Inversión (Trade Republic)":"Inversión","Cripto (Kraken)":"Inversión","Hucha gastos anuales":"Hucha anual","Transferencia entre cuentas":"Traspaso"};

function fresh(){const t=now();return{v:2,u:t,
  settings:{p1:"Eddy",p2:"Mai",split:"mitad",pct1:50,goal:20,u:t},
  cats:DEF.map(c=>({id:uid(),name:c[0],type:c[1],block:c[2]||"-",u:t})),
  accounts:["ING","Trade Republic","Cuenta de Mai"].map(n=>({id:uid(),name:n,initial:"",date:"",u:t})),
  tx:[],budget:{},
  goals:[["Colchón","Colchón"],["Quitar el préstamo antes","Amortizar préstamo"],["Inversión","Inversión"]].map(g=>({id:uid(),name:g[0],cat:g[1],target:"",start:"",date:"",u:t})),
  debts:[["Préstamo ING",true],["Préstamo ING (padre)",false],["Hacienda",true]].map(d=>({id:uid(),name:d[0],tae:"",cuota:"",pend:"",extra:"",mine:d[1],u:t})),
  bills:["Nómina Eddy","Nómina Mai","Alquiler","Facturas","Préstamos","Devolución préstamo padre"].map(c=>({id:uid(),cat:c,day:"",u:t})),
  deleted:[],ui:{}}}
/* Pasa los datos de la versión anterior a la nueva, sin perder nada */
function migrate(o){
  if(!o)return null; if(o.v===2)return o; if(o.v!==1)return null;
  const n=fresh(); const t=now();
  n.settings={...n.settings,p1:o.settings?.p1||"Eddy",p2:o.settings?.p2||"Mai",split:o.settings?.split||"mitad",pct1:o.settings?.pct1??50,goal:o.settings?.aho??20,u:t};
  const names=new Set(n.cats.map(c=>c.name));
  n.tx=(o.tx||[]).map(x=>{const nc=MAP[x.cat]||x.cat;
    if(!names.has(nc)){const old=(o.cats||[]).find(c=>c.name===x.cat);n.cats.push({id:uid(),name:nc,type:old?.type||"Gasto",block:old?.block||"-",u:t});names.add(nc)}
    return{...x,cat:nc,note:x.note||(nc!==x.cat?x.cat:""),u:x.u||t}});
  if(o.accounts?.length)n.accounts=o.accounts.map(a=>({...a}));
  if(o.debts?.length)n.debts=o.debts.map(d=>({...d}));
  if(o.goals?.length)n.goals=o.goals.map(g=>({...g,cat:MAP[g.cat]||g.cat}));
  if(o.bills?.length){const seen=new Set();n.bills=o.bills.map(b=>({...b,cat:MAP[b.cat]||b.cat})).filter(b=>!seen.has(b.cat)&&seen.add(b.cat))}
  const B={};for(const[g,v]of Object.entries(o.budget||{})){const k={"Vivienda":"Alquiler","Suministros":"Facturas","Alimentación":"Supermercado","Deudas":"Préstamos","Salud y cuidado":"Salud","Ocio":"Ocio y restaurantes","Negocio flipping":"Flipping","Otros gastos":"Otros gastos"}[g]||g;B[k]=(num(B[k])+num(v))||""}
  n.budget=B; n.deleted=o.deleted||[];
  return n;
}
function load(){try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.v===2)return o}
  const old=localStorage.getItem(OLDKEY);if(old){const m=migrate(JSON.parse(old));if(m){localStorage.setItem(KEY,JSON.stringify(m));return m}}}catch(e){}return fresh()}
let S=load(), DEMO=null; S.ui=S.ui||{};
const D=()=>DEMO||S;

const d0=new Date(); let view={y:d0.getFullYear(),m:d0.getMonth()+1}, txf={type:"",q:"",cat:""};
function jumpToData(){const st=D();if(!st.tx.length)return;
  const has=(y,m)=>st.tx.some(t=>+t.date.slice(0,4)===y&&+t.date.slice(5,7)===m);

/* ---------- cálculos ---------- */
const catOf=n=>D().cats.find(c=>c.name===n);
const colorOf=n=>{const i=D().cats.filter(c=>c.type!=="Transferencia").findIndex(c=>c.name===n);return `var(--c${((i<0?13:i)%14)+1})`};
const inPer=(t,y,m)=>{const d=t.date||"";return +d.slice(0,4)===y&&(m===0||+d.slice(5,7)===m)};
function calc(y,m){
  const st=D(),s=st.settings,o={inc:0,exp:0,sav:0,by:{},bl:{Necesidad:0,Deseo:0,Deuda:0,Negocio:0},paid1:0,paid2:0,common:0,inc1:0,inc2:0,n:0};
  for(const t of st.tx){if(!inPer(t,y,m))continue;const c=catOf(t.cat)||{type:"Gasto",block:"-"},a=num(t.amount);o.n++;
    if(c.type==="Ingreso"){o.inc+=a;if(t.who===s.p1)o.inc1+=a;else if(t.who===s.p2)o.inc2+=a}
    else if(c.type==="Gasto"){o.exp+=a;o.by[t.cat]=(o.by[t.cat]||0)+a;if(o.bl[c.block]!=null)o.bl[c.block]+=a;
      if(t.for==="Común"){o.common+=a;if(t.who===s.p1)o.paid1+=a;else if(t.who===s.p2)o.paid2+=a}}
    else if(c.type==="Ahorro")o.sav+=a}
  o.left=o.inc-o.exp-o.sav;o.rate=o.inc>0?(o.sav+Math.max(0,o.left))/o.inc:0;
  let p1=.5;if(s.split==="fijo")p1=num(s.pct1)/100;else if(s.split==="proporcional"){const T=o.inc1+o.inc2;p1=T?o.inc1/T:.5}
  o.p1=p1;o.bal=o.paid1-o.common*p1;return o}
function nper(r,A,P){if(P<=0||A<=0)return null;if(r===0)return Math.ceil(P/A);const x=1-r*P/A;if(x<=0)return Infinity;return Math.ceil(-Math.log(x)/Math.log(1+r))}
function debtInfo(d){const r=num(d.tae)/1200,A=num(d.cuota),P=num(d.pend),E=num(d.extra);const n1=nper(r,A,P),n2=E>0?nper(r,A+E,P):null;
  const i1=n1&&isFinite(n1)?A*n1-P:null,i2=n2&&isFinite(n2)?(A+E)*n2-P:null;return{n1,n2,save:i1!=null&&i2!=null?Math.max(0,i1-i2):null}}
function billState(b,y,m){const st=D();if(st.tx.some(t=>t.cat===b.cat&&inPer(t,y,m)))return"ok";
  const first=st.tx.reduce((a,t)=>(!a||t.date<a)?t.date:a,"");if(!first)return"none";
  const end=new Date(y,m,0);if(new Date(first+"T00:00")>end)return"none";
  const due=b.day?new Date(y,m-1,Math.min(+b.day,end.getDate()),23,59):new Date(y,m,0,23,59);return new Date()>due?"late":"wait"}
function balances(){const st=D();return st.accounts.map(a=>{let b=num(a.initial);for(const t of st.tx){if(a.date&&t.date<a.date)continue;const c=catOf(t.cat),x=num(t.amount);
  if(t.acc===a.name)b+=(c&&c.type==="Ingreso")?x:-x;if(t.to===a.name&&!(c&&c.type==="Ingreso"))b+=x}return{...a,bal:b}})}

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s), main=$("#main");
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const perLabel=()=>view.m===0?"Año "+view.y:MESES[view.m-1]+" "+view.y;
const monthCtl=()=>`<div class="month"><button data-a="prev" aria-label="Mes anterior">‹</button><button class="ml" data-a="year" style="border:0;background:transparent;cursor:pointer" title="Ver el año entero">${perLabel()}</button><button data-a="next" aria-label="Mes siguiente">›</button></div>`;
const demoBar=()=>DEMO?`<div class="demo"><span>Datos de ejemplo</span><button data-a="demooff">Salir</button></div>`:"";
function donut(parts,total,label){const R=62,C=2*Math.PI*R;let off=0,g="";
  if(total>0)for(const p of parts){if(p.v<=0)continue;const L=p.v/total*C;g+=`<circle cx="75" cy="75" r="${R}" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="${Math.max(L-1.5,.1)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`;off+=L}
  else g=`<circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--soft)" stroke-width="20"/>`;
  return `<svg viewBox="0 0 150 150" role="img" aria-label="Rueda de gasto">${g}<text x="75" y="74" text-anchor="middle" style="font-family:var(--mono);font-size:17px;fill:var(--ink)">${esc(f0(total))}</text><text x="75" y="92" text-anchor="middle" style="font-family:var(--body);font-size:10px;fill:var(--muted)">${esc(label)}</text></svg>`}
function yearChart(y){const data=[];for(let m=1;m<=12;m++)data.push(calc(y,m));const mx=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp+d.sav)));
  const W=Math.round(Math.max(320,Math.min(600,main.clientWidth-40))),H=170,l=4,b=20,cw=(W-l*2)/12,sc=v=>(H-b-6)*v/mx;let s="";
  data.forEach((d,i)=>{const x=l+i*cw+cw*.18,w=cw*.3,op=view.m===0||view.m===i+1?1:.35;
    s+=`<rect x="${x}" y="${H-b-sc(d.inc)}" width="${w}" height="${sc(d.inc)}" rx="2" fill="var(--pos)" opacity="${op}"/><rect x="${x+w+2}" y="${H-b-sc(d.exp)}" width="${w}" height="${sc(d.exp)}" rx="2" fill="var(--neg)" opacity="${op}"/><rect x="${x+w+2}" y="${H-b-sc(d.exp)-sc(d.sav)}" width="${w}" height="${sc(d.sav)}" rx="2" fill="var(--gold)" opacity="${op}"/>
    <text x="${x+w+1}" y="${H-5}" text-anchor="middle" style="${view.m===i+1?"fill:var(--ink);font-weight:700":""}">${MESES[i][0]}</text><rect x="${l+i*cw}" y="0" width="${cw}" height="${H}" fill="transparent" data-m="${i+1}" style="cursor:pointer"><title>${MESES[i]}: entra ${f0(d.inc)}, gastos ${f0(d.exp)}, ahorro ${f0(d.sav)}</title></rect>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos, gastos y ahorro por mes">${s}</svg></div><div class="flowk" style="justify-content:flex-start;font-size:12px;color:var(--muted)"><span><i class="dot" style="background:var(--pos)"></i>Entra</span><span><i class="dot" style="background:var(--neg)"></i>Gastos</span><span><i class="dot" style="background:var(--gold)"></i>Ahorro</span><span>· toca un mes</span></div>`}

  switch(ds.a){
    case"prev":if(view.m===0)view.y--;else if(--view.m<1){view.m=12;view.y--}render();break;
    case"next":if(view.m===0)view.y++;else if(++view.m>12){view.m=1;view.y++}render();break;
    case"year":view.m=view.m===0?(view.y===d0.getFullYear()?d0.getMonth()+1:1):0;render();break;
    case"add":openTx();break;
    case"close":close();break;
    case"deltx":arm(()=>{st.tx=st.tx.filter(t=>t.id!==F.id);markDel(F.id);save();close();render();toast("Borrado")});break;
    case"demo":DEMO=demo();render();break;
    case"demooff":DEMO=null;render();break;
    case"hintoff":try{localStorage.setItem(KEY+"-hint","1")}catch(x){}render();break;
    case"ebud":budSheet();break;
    case"ebill":billSheet();break;
    case"addbill":{const v=$("#nbill")?.value;if(v){st.bills.push({id:uid(),cat:v,day:"",u:now()});save();billSheet();render()}break}
    case"newgoal":{const g={id:uid(),name:"Nueva meta",cat:"Colchón",target:"",start:"",date:"",u:now()};st.goals.push(g);save();render();goalSheet(g.id);break}
    case"newdebt":{const d={id:uid(),name:"Nueva deuda",tae:"",cuota:"",pend:"",extra:"",mine:true,u:now()};st.debts.push(d);save();render();debtSheet(d.id);break}
    case"addacc":{const n=$("#newacc").value.trim();if(!n)return toast("Escribe el nombre");S.accounts.push({id:uid(),name:n,initial:"",date:"",u:now()});save();render();break}
    case"addcat":{const n=$("#nc").value.trim();if(!n)return toast("Escribe el nombre");if(S.cats.some(c=>c.name===n))return toast("Ya existe");const[t,b]=$("#nct").value.split("|");S.cats.push({id:uid(),name:n,type:t,block:b,u:now()});save();render();toast("Añadida");break}
    case"share":shareCopy();break;
    case"copy":navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast("Copiada: pégala en WhatsApp")).catch(()=>{const t=$("#imp");t.value=JSON.stringify(S);t.select();toast("Selecciona y copia el texto")});break;
    case"merge":{const txt=$("#imp").value.trim();if(!txt)return toast("Elige el archivo o pega la copia");try{const n0=S.tx.length;mergeIn(JSON.parse(txt));save();view={y:d0.getFullYear(),m:d0.getMonth()+1};jumpToData();render();toast(`Combinado: ${S.tx.length-n0} movimientos nuevos`)}catch(x){toast(x.message.startsWith("Esa")?x.message:"Esa copia no es válida")}break}
    case"csv":download("cuentas-casa-"+today()+".csv",csv(),"text/csv");break;
    case"wipe":arm(()=>{S=fresh();save();render();toast("Todo borrado")});break;
  }
});
document.addEventListener("submit",e=>{e.preventDefault();const st=D();
  if(e.target.id==="txform")return saveTx();
  const btn=e.submitter||e.target.querySelector('[type="submit"]'),a=btn?.dataset.a,id=btn?.dataset.id;
  if(a==="savebud"){document.querySelectorAll("[data-bud]").forEach(i=>{const v=num(i.value);if(v>0)st.budget[i.dataset.bud]=v;else delete st.budget[i.dataset.bud]})}
  if(a==="savebill"){document.querySelectorAll("[data-day]").forEach(i=>{const b=st.bills.find(x=>x.id===i.dataset.day);if(b){b.day=String(Math.min(31,parseInt(i.value)||0)||"");b.u=now()}})}
  if(a==="savegoal"){const g=st.goals.find(x=>x.id===id);Object.assign(g,{name:$("#gn").value.trim()||g.name,target:$("#gt").value,start:$("#gs").value,date:$("#gd").value,cat:$("#gc").value,u:now()})}
  if(a==="savedebt"){const d=st.debts.find(x=>x.id===id);Object.assign(d,{name:$("#dn").value.trim()||d.name,pend:$("#dp").value,cuota:$("#dc").value,tae:$("#dt").value,extra:$("#de").value,mine:$("#dm").checked,u:now()})}
  save();close();render();toast("Guardado")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
document.addEventListener("pointerdown",e=>{if(e.target.id==="ov")close()});
document.addEventListener("input",e=>{if(e.target.id==="q"){txf.q=e.target.value;const p=e.target.selectionStart;render();const q=$("#q");q.focus();try{q.setSelectionRange(p,p)}catch(x){}}});
document.addEventListener("change",e=>{const t=e.target,ds=t.dataset;
  if(t.id==="impfile"&&t.files[0]){const r=new FileReader();r.onload=()=>{$("#imp").value=r.result;toast("Listo: pulsa Combinar")};r.readAsText(t.files[0]);return}
  if(ds.acc){const a=S.accounts.find(x=>x.id===ds.acc);if(!a)return;if(ds.f==="name"){const old=a.name,nw=t.value.trim();if(!nw)return render();S.tx.forEach(x=>{if(x.acc===old)x.acc=nw;if(x.to===old)x.to=nw})}a[ds.f]=ds.f==="name"?t.value.trim():t.value;a.u=now();save();render();return}
  if(["p1","p2","pct1","goal"].includes(t.id)){const s=S.settings,old=s[t.id];s[t.id]=(t.id==="p1"||t.id==="p2")?(t.value.trim()||old):num(t.value);
    if((t.id==="p1"||t.id==="p2")&&old!==s[t.id])S.tx.forEach(x=>{if(x.who===old)x.who=s[t.id];if(x.for===old)x.for=s[t.id]});s.u=now();save();render();toast("Guardado")}});
render();
})();
</script>
